server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

resilience4j:
  circuitbreaker:
    instances:
      orderService:
        failure-rate-threshold: 50
        minimum-number-of-calls: 3
        sliding-window-size: 5
        wait-duration-in-open-state: 10s
